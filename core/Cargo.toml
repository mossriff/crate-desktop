[package]
name = "crate-core"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
description = "UI-independent core of Crate: Navidrome client, audio engine, queue, MPRIS"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls", "json"] }
rodio = { version = "0.20", default-features = false, features = ["symphonia-mp3", "symphonia-flac", "symphonia-isomp4", "symphonia-aac", "symphonia-vorbis", "symphonia-wav"] }
souvlaki = "0.7"
rand = "0.8"
dirs = "5"
lofty = "0.22"
csv = "1"
lindera = { version = "6", features = ["embed-ipadic"] }
wana_kana = "5"
kakasi = "0.1"
md5 = "0.8"
