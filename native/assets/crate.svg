<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <!-- crate: a crate of records, one pulled half out -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f2b450"/>
      <stop offset="1" stop-color="#d98a22"/>
    </linearGradient>
    <linearGradient id="wood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b1e0d"/>
      <stop offset="1" stop-color="#160f06"/>
    </linearGradient>
  </defs>
  <rect x="8" y="8" width="240" height="240" rx="56" fill="url(#bg)"/>
  <!-- record sleeves standing in the crate -->
  <rect x="52" y="66" width="96" height="96" rx="8" fill="#7a5320" transform="rotate(-12 100 150)"/>
  <rect x="112" y="72" width="96" height="96" rx="8" fill="#4a3214" transform="rotate(9 160 150)"/>
  <!-- the record being pulled out -->
  <g transform="translate(118 84)">
    <circle r="50" fill="#120c05"/>
    <circle r="40" fill="none" stroke="#3b2b15" stroke-width="2.5"/>
    <circle r="30" fill="none" stroke="#3b2b15" stroke-width="2"/>
    <circle r="15" fill="#f2b450"/>
    <circle r="3.5" fill="#120c05"/>
  </g>
  <!-- the crate -->
  <rect x="36" y="134" width="184" height="88" rx="14" fill="url(#wood)"/>
  <rect x="36" y="134" width="184" height="88" rx="14" fill="none" stroke="#f7e3b8" stroke-opacity=".16" stroke-width="2"/>
  <rect x="104" y="146" width="48" height="9" rx="4.5" fill="#0b0703"/>
  <rect x="56" y="170" width="144" height="8" rx="4" fill="#f2b450" opacity=".8"/>
  <rect x="56" y="193" width="144" height="8" rx="4" fill="#f2b450" opacity=".45"/>
</svg>
