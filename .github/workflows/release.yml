# Builds the AppImage. Pushing a tag like v0.1.0 makes a draft release with it attached (publish
# the draft on GitHub when you're happy with it); running it by hand just builds it, and the
# AppImage is downloadable from the run's page.
name: AppImage

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  appimage:
    # the oldest supported Ubuntu, so the AppImage runs on as many systems as possible (glibc)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config clang cmake \
            libasound2-dev libdbus-1-dev libfontconfig1-dev libfreetype-dev libwayland-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libxcb1-dev libx11-xcb-dev libvulkan-dev libzstd-dev
      - uses: dtolnay/rust-toolchain@stable
      # no build cache: a cached build can point at the unpacked romaji dictionary, which a fresh
      # checkout doesn't have (releases are rare, so a full build is fine)
      - name: Build
        run: native/tools/appimage.sh
      - uses: actions/upload-artifact@v4
        with:
          name: crate-AppImage
          path: target/crate-*.AppImage
      - name: Draft release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" target/crate-*.AppImage --draft --title "crate ${GITHUB_REF_NAME#v}" --generate-notes
