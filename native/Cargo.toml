[package]
name = "crate-native"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
description = "crate with a native GPU (gpui) interface"

[[bin]]
name = "crate-native"
path = "src/main.rs"

[dependencies]
libc = "0.2"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
crate-core = { path = "../core" }
# pinned together: gpui-component 0.10 is built against this gpui snapshot.
# gpui_platform ships with no window system unless wayland/x11 are enabled explicitly.
gpui = { package = "gpui-pre", version = "=0.3.12" }
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.12", features = ["wayland", "x11"] }
gpui-component = "=0.10.0"
gpui-kit-assets = "=0.10.0"
async-channel = "2"
anyhow = "1"
env_logger = "0.11"
serde_json = "1"
dirs = "5"
